name: Load parcels to D1 (Phase 13b-2)

on:
  workflow_dispatch:
    inputs:
      county:
        description: "County to load (tooele|salt_lake|utah|davis|weber|wasatch|box_elder|all)"
        required: false
        default: "all"
      dry_run:
        description: "Dry run (generate SQL only, no D1 writes)"
        required: false
        default: "false"

jobs:
  load:
    name: "Load ${{ matrix.county }}"
    strategy:
      fail-fast: false
      matrix:
        county: [tooele, salt_lake, utah, davis, weber, wasatch, box_elder]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    if: ${{ github.event.inputs.county == 'all' || github.event.inputs.county == matrix.county }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies (wrangler)
        run: npm ci

      - name: Download CSV from tooele-land-intel
        run: |
          mkdir -p /tmp/parcels
          curl -fsSL \
            "https://raw.githubusercontent.com/camsrigby-hash/tooele-land-intel/main/data/raw/parcels_${{ matrix.county }}.csv" \
            -o "/tmp/parcels/parcels_${{ matrix.county }}.csv"
          echo "Downloaded $(wc -l < /tmp/parcels/parcels_${{ matrix.county }}.csv) lines (including header)"

      - name: Generate SQL chunks
        id: gen
        run: |
          cat > /tmp/gen_sql.py << 'PYEOF'
          import csv, hashlib, json, os
          from datetime import datetime, timezone

          COUNTY = "${{ matrix.county }}"
          SIGNAL_COUNTIES = {"tooele", "salt_lake", "utah"}
          CHUNK_SIZE = 1000
          NOW = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          SQL_DIR = "/tmp/sql"
          os.makedirs(SQL_DIR, exist_ok=True)

          def field_hash(row):
              key = "|".join([
                  str(row.get("bldg_sqft") or ""),
                  str(row.get("built_yr") or ""),
                  str(row.get("prop_class") or ""),
                  str(row.get("total_market_value") or ""),
              ])
              return hashlib.sha256(key.encode()).hexdigest()[:32]

          def vacancy(bldg_sqft, prop_class):
              try:
                  sqft = int(float(bldg_sqft)) if bldg_sqft else 0
              except Exception:
                  sqft = 0
              pc = str(prop_class or "").upper()
              if pc.startswith("A") or pc in ("51", "52", "53", "54", "55"):
                  return "agricultural"
              if sqft > 500:
                  return "developed"
              if sqft > 0:
                  return "older_structure"
              return "vacant"

          def sq(v):
              if v is None or str(v).strip() in ("", "None"):
                  return "NULL"
              return "'" + str(v).replace("'", "''") + "'"

          def num(v):
              if v is None or str(v).strip() in ("", "None"):
                  return "NULL"
              try:
                  return str(float(v))
              except Exception:
                  return "NULL"

          def intv(v, default="NULL"):
              if v is None or str(v).strip() in ("", "None"):
                  return default
              try:
                  return str(int(float(v)))
              except Exception:
                  return default

          rows_read = 0
          pc_chunks = 0
          lg_chunks = 0
          pc_buf = []
          lg_buf = []

          csv_path = f"/tmp/parcels/parcels_{COUNTY}.csv"
          with open(csv_path, newline="", encoding="utf-8") as f:
              for row in csv.DictReader(f):
                  pid = (row.get("parcel_id") or "").strip()
                  if not pid:
                      continue
                  rows_read += 1

                  jur = (row.get("parcel_city") or "").strip() or None
                  if COUNTY not in SIGNAL_COUNTIES:
                      jur = None

                  bsqft = row.get("bldg_sqft", "0") or "0"
                  byr = row.get("built_yr") or row.get("effective_built_yr")
                  pc = row.get("prop_class")
                  vs = vacancy(bsqft, pc)
                  fh = field_hash(row)

                  pc_buf.append(
                      "INSERT OR REPLACE INTO parcel_records"
                      "(id,jurisdiction,county,acreage,centroid_lng,centroid_lat,"
                      "bldg_sqft,built_yr,prop_class,vacancy_status,polygon_geojson,"
                      "field_hash,commute_corridor_method,enriched_at) VALUES("
                      + ",".join([
                          sq(pid),
                          sq(jur or ''),
                          sq(COUNTY),
                          num(row.get("acreage")),
                          num(row.get("centroid_lng")),
                          num(row.get("centroid_lat")),
                          intv(bsqft, "0"),
                          intv(byr),
                          sq(pc),
                          sq(vs),
                          sq(row.get("polygon_geojson")),
                          sq(fh),
                          "'proxy'",
                          f"'{NOW}'",
                      ]) + ");"
                  )
                  lg_buf.append(
                      "INSERT OR REPLACE INTO parcel_enrichment_log"
                      "(parcel_id,source,status,enriched_at) VALUES("
                      + ",".join([sq(pid), "'ugrc_lir'", "'ok'", f"'{NOW}'"]) + ");"
                  )

                  if len(pc_buf) >= CHUNK_SIZE:
                      with open(f"{SQL_DIR}/chunk_{pc_chunks:04d}.sql", "w") as cf:
                          cf.write("\n".join(pc_buf))
                      pc_chunks += 1
                      pc_buf = []
                  if len(lg_buf) >= CHUNK_SIZE:
                      with open(f"{SQL_DIR}/log_{lg_chunks:04d}.sql", "w") as cf:
                          cf.write("\n".join(lg_buf))
                      lg_chunks += 1
                      lg_buf = []

          if pc_buf:
              with open(f"{SQL_DIR}/chunk_{pc_chunks:04d}.sql", "w") as cf:
                  cf.write("\n".join(pc_buf))
              pc_chunks += 1
          if lg_buf:
              with open(f"{SQL_DIR}/log_{lg_chunks:04d}.sql", "w") as cf:
                  cf.write("\n".join(lg_buf))
              lg_chunks += 1

          meta = {
              "county": COUNTY,
              "rows": rows_read,
              "pc_chunks": pc_chunks,
              "lg_chunks": lg_chunks,
              "generated_at": NOW,
          }
          with open("/tmp/meta.json", "w") as mf:
              json.dump(meta, mf)
          print(json.dumps(meta))

          github_output = os.environ.get("GITHUB_OUTPUT", "")
          if github_output:
              with open(github_output, "a") as go:
                  go.write(f"rows={rows_read}\n")
          PYEOF
          python3 /tmp/gen_sql.py

      - name: Upload SQL artifacts (dry-run inspection)
        if: github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sql-chunks-${{ matrix.county }}
          path: /tmp/sql/

      - name: Execute parcel_records chunks
        if: github.event.inputs.dry_run != 'true'
        run: |
          DB="wasatch-intel-db"
          FAILED=0
          for chunk in $(ls /tmp/sql/chunk_*.sql 2>/dev/null | sort); do
            echo "→ $chunk"
            if ! npx wrangler d1 execute "$DB" --remote --file "$chunk" 2>&1; then
              echo "Retry: $chunk (waiting 10s)"
              sleep 10
              if ! npx wrangler d1 execute "$DB" --remote --file "$chunk" 2>&1; then
                echo "FAILED: $chunk"
                FAILED=$((FAILED + 1))
              fi
            fi
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "ERROR: $FAILED parcel chunk(s) failed"
            exit 1
          fi

      - name: Execute parcel_enrichment_log chunks
        if: github.event.inputs.dry_run != 'true'
        run: |
          DB="wasatch-intel-db"
          FAILED=0
          for chunk in $(ls /tmp/sql/log_*.sql 2>/dev/null | sort); do
            echo "→ $chunk"
            if ! npx wrangler d1 execute "$DB" --remote --file "$chunk" 2>&1; then
              sleep 10
              if ! npx wrangler d1 execute "$DB" --remote --file "$chunk" 2>&1; then
                echo "FAILED: $chunk"
                FAILED=$((FAILED + 1))
              fi
            fi
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "ERROR: $FAILED log chunk(s) failed"
            exit 1
          fi

      - name: Write cron_runs summary
        if: github.event.inputs.dry_run != 'true'
        run: |
          ROWS="${{ steps.gen.outputs.rows }}"
          NOW="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          RUN_ID="load-${{ matrix.county }}-$(date -u +%s)"
          npx wrangler d1 execute wasatch-intel-db --remote --command \
            "INSERT OR IGNORE INTO cron_runs (id, workflow_name, ran_at, status, items_processed, notes) VALUES ('${RUN_ID}', 'load_parcels_to_d1', '${NOW}', 'success', ${ROWS:-0}, 'county=${{ matrix.county }}');"

      - name: Upload failed SQL artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-sql-${{ matrix.county }}
          path: /tmp/sql/
