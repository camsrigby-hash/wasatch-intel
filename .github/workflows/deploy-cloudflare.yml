name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Show build output (diagnostic)
        run: |
          echo "=== root ==="
          ls -la
          echo "=== .output (if exists) ==="
          ls -la .output/ 2>/dev/null || echo ".output/ not found"
          echo "=== dist (if exists) ==="
          ls -la dist/ 2>/dev/null || echo "dist/ not found"

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy .output --project-name=wasatch-intel --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
