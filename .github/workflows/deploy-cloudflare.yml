name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Show build output (diagnostic)
        run: |
          echo "=== dist/server/ ==="
          ls -la dist/server/ 2>/dev/null || echo "dist/server/ not found"
          echo "=== dist/server/wrangler.json ==="
          cat dist/server/wrangler.json 2>/dev/null || echo "wrangler.json not found"
          echo "=== dist/client/ (first 10 files) ==="
          ls dist/client/ 2>/dev/null | head -10 || echo "dist/client/ not found"

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
