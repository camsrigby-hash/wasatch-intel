name: Enrich parcels — Census ACS spatial join (Phase 13b-6b)

# Phase 13b-6b: Spatial-join parcel centroids → census block-group polygons
# → median_income.  Reads census_acs_blockgroups.csv (with boundary_geojson)
# and the county parcel CSVs from tooele-land-intel, performs a point-in-polygon
# test with shapely, and executes UPDATE parcel_records SET median_income = ...
# chunks against D1.
#
# Spec: wasatch-intel/docs/PHASE_13_ENRICHMENT_ARCH.md §5 13b-6b
# Depends on: 13b-2 (parcel centroids in D1) + 13b-6a (block-group CSV)

on:
  workflow_dispatch:
    inputs:
      county:
        description: "County to process (tooele|salt_lake|utah|davis|weber|wasatch|box_elder|all)"
        required: false
        default: "all"
      dry_run:
        description: "Dry run — generate SQL but do not write to D1"
        required: false
        default: "false"

jobs:
  join:
    name: "Enrich ${{ matrix.county }}"
    strategy:
      fail-fast: false
      matrix:
        county: [tooele, salt_lake, utah, davis, weber, wasatch, box_elder]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      COUNTY: ${{ matrix.county }}

    steps:
      - name: Check county filter
        id: filter
        run: |
          INPUT="${{ github.event.inputs.county }}"
          COUNTY="${{ matrix.county }}"
          if [ "$INPUT" = "all" ] || [ "$INPUT" = "$COUNTY" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping $COUNTY (input county: $INPUT)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.filter.outputs.run == 'true'

      - name: Set up Python
        if: steps.filter.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install shapely
        if: steps.filter.outputs.run == 'true'
        run: pip install shapely

      - name: Set up Node.js
        if: steps.filter.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        if: steps.filter.outputs.run == 'true'
        run: npm install -g wrangler

      - name: Download census_acs_blockgroups.csv
        if: steps.filter.outputs.run == 'true'
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/camsrigby-hash/tooele-land-intel/main/data/raw/census_acs_blockgroups.csv" \
            -o /tmp/census_acs_blockgroups.csv
          ROW_COUNT=$(tail -n +2 /tmp/census_acs_blockgroups.csv | wc -l | tr -d ' ')
          echo "Downloaded ${ROW_COUNT} block-group rows"

      - name: Download parcel CSV
        if: steps.filter.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/parcels
          BASE="https://raw.githubusercontent.com/camsrigby-hash/tooele-land-intel/main/data/raw"
          COUNTY="${{ matrix.county }}"
          if curl -fsSL "$BASE/parcels_${COUNTY}.csv.gz" -o "/tmp/parcels/parcels_${COUNTY}.csv.gz" 2>/dev/null; then
            echo "Downloaded compressed CSV from git"
          elif curl -fsSL "$BASE/parcels_${COUNTY}.csv" -o "/tmp/parcels/parcels_${COUNTY}.csv" 2>/dev/null; then
            echo "Downloaded plain CSV from git"
          else
            echo "Git download failed — trying GitHub release asset..."
            gh release download "large-parcels" \
              -p "parcels_${COUNTY}.csv.gz" \
              -R camsrigby-hash/tooele-land-intel \
              -D /tmp/parcels/
            echo "Downloaded release asset"
          fi
          # Report line count
          if [ -f "/tmp/parcels/parcels_${COUNTY}.csv.gz" ]; then
            echo "Compressed file size: $(wc -c < /tmp/parcels/parcels_${COUNTY}.csv.gz) bytes"
          else
            echo "CSV line count: $(wc -l < /tmp/parcels/parcels_${COUNTY}.csv)"
          fi

      - name: Spatial join — centroid → block group → median_income
        if: steps.filter.outputs.run == 'true'
        id: join
        run: |
          python3 - <<'PYEOF'
          import csv, sys, json, os, gzip, pathlib
          csv.field_size_limit(sys.maxsize)
          from shapely.geometry import shape, Point
          from shapely.strtree import STRtree

          COUNTY = os.environ["COUNTY"]
          COUNTY_FIPS_MAP = {
              "tooele":    "045",
              "salt_lake": "035",
              "utah":      "049",
              "davis":     "011",
              "weber":     "057",
              "wasatch":   "051",
              "box_elder": "003",
          }
          COUNTY_FIPS = COUNTY_FIPS_MAP[COUNTY]
          CHUNK_SIZE = 500

          print(f"=== {COUNTY} (FIPS {COUNTY_FIPS}) ===", flush=True)

          # ── Load block groups ──────────────────────────────────────────────
          block_groups = []  # list of (shapely_geom, income_int_or_None, geoid)
          with open("/tmp/census_acs_blockgroups.csv", newline="", encoding="utf-8") as f:
              for row in csv.DictReader(f):
                  if row.get("county_fips", "") != COUNTY_FIPS:
                      continue
                  boundary_str = row.get("boundary_geojson", "").strip()
                  if not boundary_str:
                      continue
                  income_str = row.get("median_income", "").strip()
                  try:
                      income_val = int(income_str) if income_str else None
                  except ValueError:
                      income_val = None
                  try:
                      geom = shape(json.loads(boundary_str))
                      block_groups.append((geom, income_val, row.get("geoid", "")))
                  except Exception as e:
                      print(f"  Skip geoid {row.get('geoid','?')}: {e}", flush=True)

          print(f"Loaded {len(block_groups)} block groups for {COUNTY}", flush=True)

          if not block_groups:
              print("No block groups with boundaries — nothing to join", flush=True)
              sys.exit(0)

          # ── Build spatial index ────────────────────────────────────────────
          polygons = [bg[0] for bg in block_groups]
          tree = STRtree(polygons)

          # ── Open parcel CSV ────────────────────────────────────────────────
          parcel_gz  = f"/tmp/parcels/parcels_{COUNTY}.csv.gz"
          parcel_csv = f"/tmp/parcels/parcels_{COUNTY}.csv"

          def open_parcel():
              if os.path.exists(parcel_gz):
                  return gzip.open(parcel_gz, "rt", encoding="utf-8")
              return open(parcel_csv, newline="", encoding="utf-8")

          # ── Spatial join ───────────────────────────────────────────────────
          sql_dir = pathlib.Path("/tmp/update_sql")
          sql_dir.mkdir(exist_ok=True)

          seen_pids = set()
          updates_income = []   # UPDATE parcel_records SET median_income = ...
          updates_log    = []   # INSERT OR REPLACE INTO parcel_enrichment_log
          matched = unmatched = no_centroid = 0
          NOW = __import__("datetime").datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")

          with open_parcel() as f:
              for row in csv.DictReader(f):
                  pid = (row.get("parcel_id") or "").strip()
                  if not pid or pid in seen_pids:
                      continue
                  seen_pids.add(pid)

                  try:
                      lng = float(row.get("centroid_lng") or "")
                      lat = float(row.get("centroid_lat") or "")
                  except (ValueError, TypeError):
                      no_centroid += 1
                      continue

                  pt = Point(lng, lat)
                  income_val = None
                  for idx in tree.query(pt):
                      geom, inc, _ = block_groups[int(idx)]
                      if geom.contains(pt):
                          income_val = inc
                          break

                  pid_esc = pid.replace("'", "''")

                  if income_val is not None:
                      updates_income.append(
                          f"UPDATE parcel_records SET median_income = {income_val} "
                          f"WHERE id = '{pid_esc}';"
                      )
                      updates_log.append(
                          f"INSERT OR REPLACE INTO parcel_enrichment_log "
                          f"(parcel_id,source,status,enriched_at) VALUES "
                          f"('{pid_esc}','census_acs_join','ok','{NOW}');"
                      )
                      matched += 1
                  else:
                      unmatched += 1

          print(
              f"Join: {len(seen_pids)} unique parcels | "
              f"matched={matched} | unmatched={unmatched} | no_centroid={no_centroid}",
              flush=True,
          )

          # ── Write SQL chunks ───────────────────────────────────────────────
          def write_chunks(stmts, prefix):
              chunks = [stmts[i:i+CHUNK_SIZE] for i in range(0, len(stmts), CHUNK_SIZE)]
              for idx, chunk in enumerate(chunks):
                  with open(sql_dir / f"{prefix}_{idx:04d}.sql", "w") as wf:
                      wf.write("\n".join(chunk))
              return len(chunks)

          n_update = write_chunks(updates_income, "update")
          n_log    = write_chunks(updates_log,    "log")
          print(f"Generated {n_update} update chunks, {n_log} log chunks", flush=True)

          github_output = os.environ.get("GITHUB_OUTPUT", "")
          if github_output:
              with open(github_output, "a") as go:
                  go.write(f"matched={matched}\n")
                  go.write(f"unmatched={unmatched}\n")
                  go.write(f"update_chunks={n_update}\n")
          PYEOF

      - name: Upload SQL artifacts (dry-run inspection)
        if: steps.filter.outputs.run == 'true' && github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: census-join-sql-${{ matrix.county }}
          path: /tmp/update_sql/
          retention-days: 7

      - name: Execute UPDATE median_income chunks
        if: steps.filter.outputs.run == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          DB="wasatch-intel-db"
          FAILED=0
          for chunk in $(ls /tmp/update_sql/update_*.sql 2>/dev/null | sort); do
            echo "→ $chunk"
            OK=false
            for delay in 15 30 60; do
              if npx wrangler d1 execute "$DB" --remote --file "$chunk" 2>&1; then
                OK=true; break
              fi
              echo "Retry: $chunk (waiting ${delay}s)"
              sleep $delay
            done
            if [ "$OK" = "false" ]; then
              echo "FAILED: $chunk"
              FAILED=$((FAILED + 1))
            fi
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "ERROR: $FAILED median_income chunk(s) failed"
            exit 1
          fi

      - name: Execute parcel_enrichment_log chunks
        if: steps.filter.outputs.run == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          DB="wasatch-intel-db"
          for chunk in $(ls /tmp/update_sql/log_*.sql 2>/dev/null | sort); do
            echo "→ $chunk"
            for delay in 15 30 60; do
              if npx wrangler d1 execute "$DB" --remote --file "$chunk" 2>&1; then
                break
              fi
              echo "Retry: $chunk (waiting ${delay}s)"
              sleep $delay
            done
          done

      - name: Write cron_runs summary
        if: steps.filter.outputs.run == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          MATCHED="${{ steps.join.outputs.matched }}"
          NOW="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          RUN_ID="census-join-${{ matrix.county }}-$(date -u +%s)"
          npx wrangler d1 execute wasatch-intel-db --remote --command \
            "INSERT OR IGNORE INTO cron_runs (id, workflow_name, ran_at, status, items_processed, notes) \
             VALUES ('${RUN_ID}', 'enrich_parcels_census_join', '${NOW}', 'success', ${MATCHED:-0}, 'county=${{ matrix.county }}');"

      - name: Upload failed SQL artifacts
        if: steps.filter.outputs.run == 'true' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-census-join-sql-${{ matrix.county }}
          path: /tmp/update_sql/
