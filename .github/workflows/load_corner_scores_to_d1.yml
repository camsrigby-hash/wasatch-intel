name: Load Corner Scores to D1

on:
  workflow_dispatch:
    inputs:
      csv_url:
        description: "URL for parcel_corner_scores.csv"
        required: true
        default: "https://raw.githubusercontent.com/camsrigby-hash/tooele-land-intel/phase-13b-3-corner-detection/data/raw/parcel_corner_scores.csv"
      dry_run:
        description: "Generate SQL chunks but do not execute against D1"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  DB: wasatch-intel-db
  CHUNK_SIZE: "500"

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install --no-save wrangler@latest

      - name: Download corner score CSV
        run: |
          mkdir -p /tmp/corner_scores
          curl -L --fail --retry 3 --retry-delay 5 \
            "${{ github.event.inputs.csv_url }}" \
            -o /tmp/corner_scores/parcel_corner_scores.csv
          wc -l /tmp/corner_scores/parcel_corner_scores.csv
          head -1 /tmp/corner_scores/parcel_corner_scores.csv

      - name: Generate UPDATE SQL chunks
        id: gen
        run: |
          python - <<'PYEOF'
          import csv
          import os
          from pathlib import Path

          csv_path = Path('/tmp/corner_scores/parcel_corner_scores.csv')
          sql_dir = Path('/tmp/corner_score_sql')
          sql_dir.mkdir(parents=True, exist_ok=True)
          chunk_size = int(os.environ.get('CHUNK_SIZE', '500'))

          def sql_string(value: str) -> str:
              return "'" + (value or '').replace("'", "''") + "'"

          rows = []
          with csv_path.open(newline='') as f:
              reader = csv.DictReader(f)
              expected = ['parcel_id', 'corner_score', 'road_count', 'top_road_class']
              if reader.fieldnames != expected:
                  raise SystemExit(f'Unexpected header: {reader.fieldnames}; expected {expected}')
              for row in reader:
                  parcel_id = (row.get('parcel_id') or '').strip()
                  if not parcel_id:
                      continue
                  try:
                      score = float(row.get('corner_score') or 0)
                  except ValueError:
                      score = 0.0
                  score = max(0.0, min(1.0, score))
                  rows.append((parcel_id, score))

          chunks = [rows[i:i + chunk_size] for i in range(0, len(rows), chunk_size)]
          for idx, chunk in enumerate(chunks, start=1):
              cases = []
              ids = []
              for parcel_id, score in chunk:
                  pid = sql_string(parcel_id)
                  cases.append(f"WHEN {pid} THEN {score:.2f}")
                  ids.append(pid)
              sql = (
                  "UPDATE parcel_records\n"
                  "SET corner_score = CASE id\n  "
                  + "\n  ".join(cases)
                  + "\n  ELSE corner_score END\n"
                  + "WHERE id IN (" + ",".join(ids) + ");\n"
              )
              (sql_dir / f'corner_scores_{idx:04d}.sql').write_text(sql)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as go:
              go.write(f'rows={len(rows)}\n')
              go.write(f'chunks={len(chunks)}\n')
          print(f'Generated {len(chunks)} SQL chunks for {len(rows):,} rows in {sql_dir}')
          PYEOF

      - name: Upload SQL chunks for inspection
        uses: actions/upload-artifact@v4
        with:
          name: corner-score-sql-chunks
          path: /tmp/corner_score_sql/
          retention-days: 7

      - name: Execute corner score chunks
        if: github.event.inputs.dry_run != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          FAILED=0
          START_TIME=$(date +%s%3N)
          for chunk in $(ls /tmp/corner_score_sql/corner_scores_*.sql 2>/dev/null | sort); do
            echo "→ $chunk"
            OK=false
            for delay in 15 30 60; do
              if npx wrangler d1 execute "$DB" --remote --file "$chunk" 2>&1; then
                OK=true; break
              fi
              echo "Retry: $chunk (waiting ${delay}s)"
              sleep "$delay"
            done
            if [ "$OK" = "false" ]; then
              echo "FAILED: $chunk"
              FAILED=$((FAILED + 1))
            fi
          done
          END_TIME=$(date +%s%3N)
          echo "DURATION_MS=$((END_TIME - START_TIME))" >> "$GITHUB_ENV"
          echo "FAILED_CHUNKS=$FAILED" >> "$GITHUB_ENV"
          if [ "$FAILED" -gt 0 ]; then
            echo "ERROR: $FAILED corner score chunk(s) failed"
            exit 1
          fi

      - name: Write cron_runs summary
        if: github.event.inputs.dry_run != 'true' && always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="success"
          else
            STATUS="failure"
          fi
          NOW="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          RUN_ID="corner-scores-$(date -u +%s)"
          npx wrangler d1 execute "$DB" --remote --command \
            "INSERT OR IGNORE INTO cron_runs (id, workflow_name, ran_at, status, duration_ms, items_processed, notes) VALUES ('${RUN_ID}', 'load_corner_scores_to_d1', '${NOW}', '${STATUS}', ${DURATION_MS:-0}, ${{ steps.gen.outputs.rows }}, 'Phase 13b-3 corner_score load. Failed chunks: ${FAILED_CHUNKS:-0}.');"

      - name: Verify D1 corner score coverage
        if: github.event.inputs.dry_run != 'true' && success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== corner_score coverage ==="
          npx wrangler d1 execute "$DB" --remote --command \
            "SELECT COUNT(*) AS total, SUM(CASE WHEN corner_score IS NOT NULL THEN 1 ELSE 0 END) AS populated, ROUND(100.0 * SUM(CASE WHEN corner_score IS NOT NULL THEN 1 ELSE 0 END) / COUNT(*), 2) AS pct_populated FROM parcel_records;"
          echo "=== score histogram ==="
          npx wrangler d1 execute "$DB" --remote --command \
            "SELECT corner_score, COUNT(*) AS count FROM parcel_records GROUP BY corner_score ORDER BY corner_score;"
          echo "=== high score share ==="
          npx wrangler d1 execute "$DB" --remote --command \
            "SELECT COUNT(*) AS high_score_rows FROM parcel_records WHERE corner_score >= 0.7;"
