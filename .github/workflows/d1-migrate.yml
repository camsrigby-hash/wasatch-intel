name: D1 migrate (Phase 8 — deals schema)
# Applies schema.sql to the existing wasatch-intel-db D1 database.
# All statements use CREATE TABLE IF NOT EXISTS / CREATE INDEX IF NOT EXISTS, so this is idempotent.
# Run once after Phase 8 ships to add the deals, deal_notes, deal_contacts tables.
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Apply schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute wasatch-intel-db \
            --file=src/server/lib/schema.sql \
            --remote

      - name: Verify tables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute wasatch-intel-db \
            --remote \
            --command="SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;"
