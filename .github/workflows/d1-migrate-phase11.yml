name: D1 migrate — Phase 11 (pipeline_rebuild)
# Applies migrations/0002_pipeline_rebuild.sql via wrangler d1 migrations apply.
# Safe to re-run: wrangler tracks applied migrations in D1_MIGRATIONS table.
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Apply migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply wasatch-intel-db --remote

      - name: Verify tables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute wasatch-intel-db \
            --remote \
            --command="SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;"
