name: D1 setup (one-time)
# Run once to create the D1 database, apply the Phase 7 schema, and set the Resend Workers secret.
# Safe to re-run: d1 create is idempotent (errors if already exists; we fall back to d1 list).
on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ── Task 1: create D1 database ─────────────────────────────────────────
      - name: Create D1 database
        id: create_d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CREATE_OUT=$(npx wrangler d1 create wasatch-intel-db 2>&1 || true)
          echo "$CREATE_OUT"

          # Extract database_id from creation output (format: database_id = "uuid")
          DB_ID=$(echo "$CREATE_OUT" | grep -oP '(?<=database_id = ")[^"]+' | head -1 || true)

          if [ -z "$DB_ID" ]; then
            echo "Creation output didn't contain database_id — database may already exist. Fetching from list..."
            LIST_OUT=$(npx wrangler d1 list --json 2>&1)
            echo "$LIST_OUT"
            DB_ID=$(echo "$LIST_OUT" | jq -r '.[] | select(.name == "wasatch-intel-db") | .uuid // .database_id // empty' | head -1 || true)
          fi

          if [ -z "$DB_ID" ]; then
            echo "ERROR: Could not determine database_id. Aborting."
            exit 1
          fi

          echo "===WASATCH_DB_ID_START===${DB_ID}===WASATCH_DB_ID_END==="
          echo "database_id=${DB_ID}" >> $GITHUB_OUTPUT

      # ── Task 2: apply schema migration ─────────────────────────────────────
      - name: Apply schema migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute wasatch-intel-db \
            --file=src/server/lib/schema.sql \
            --remote

      - name: Verify tables exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute wasatch-intel-db \
            --remote \
            --command="SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;"

      # ── Task 3: set Resend Workers secret ──────────────────────────────────
      - name: Set RESEND_API_KEY Workers secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          echo "$RESEND_KEY" | npx wrangler secret put RESEND_API_KEY

      - name: Summary
        run: |
          echo "=== SETUP COMPLETE ==="
          echo "database_id: ${{ steps.create_d1.outputs.database_id }}"
          echo "Schema applied and verified."
          echo "RESEND_API_KEY Workers secret set."
          echo "Next step: update wrangler.jsonc with the database_id above, then re-deploy."
