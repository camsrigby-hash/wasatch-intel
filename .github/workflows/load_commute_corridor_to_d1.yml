name: Load commute corridor scores to D1 (Phase 13b-7)

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "tooele-land-intel branch or ref containing data/raw/parcel_commute_corridor_scores.csv"
        required: false
        default: "main"
      dry_run:
        description: "Dry run (generate SQL only, no D1 writes)"
        required: false
        default: "false"

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Download commute corridor score CSV
        run: |
          mkdir -p /tmp/commute
          REF="${{ github.event.inputs.source_branch }}"
          URL="https://raw.githubusercontent.com/camsrigby-hash/tooele-land-intel/${REF}/data/raw/parcel_commute_corridor_scores.csv"
          curl -fsSL "$URL" -o /tmp/commute/parcel_commute_corridor_scores.csv
          echo "Downloaded $(wc -l < /tmp/commute/parcel_commute_corridor_scores.csv) lines including header"

      - name: Generate 500-row SQL chunks
        id: gen
        run: |
          cat > /tmp/gen_commute_sql.py << 'PYEOF'
          import csv, json, os, sys
          from datetime import datetime, timezone
          csv.field_size_limit(sys.maxsize)

          CSV_PATH = "/tmp/commute/parcel_commute_corridor_scores.csv"
          SQL_DIR = "/tmp/sql"
          CHUNK_SIZE = 500
          NOW = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          os.makedirs(SQL_DIR, exist_ok=True)

          def sq(v):
              if v is None or str(v).strip() == "":
                  return "NULL"
              return "'" + str(v).replace("'", "''") + "'"

          def num(v):
              if v is None or str(v).strip() == "":
                  return "NULL"
              try:
                  return str(float(v))
              except Exception:
                  return "NULL"

          rows_read = 0
          chunks = 0
          buf = []
          with open(CSV_PATH, newline="", encoding="utf-8") as f:
              reader = csv.DictReader(f)
              expected = [
                  "parcel_id",
                  "commute_corridor_score",
                  "nearest_ramp_id",
                  "distance_mi",
                  "approach_side_bool",
                  "commute_corridor_method",
              ]
              if reader.fieldnames != expected:
                  raise SystemExit(f"Unexpected CSV schema: {reader.fieldnames}")
              for row in reader:
                  pid = (row.get("parcel_id") or "").strip()
                  if not pid:
                      continue
                  method = (row.get("commute_corridor_method") or "").strip()
                  if method != "proxy":
                      raise SystemExit(f"Non-proxy method for {pid}: {method}")
                  score = num(row.get("commute_corridor_score"))
                  buf.append(
                      "UPDATE parcel_records SET "
                      f"commute_corridor_score = {score}, "
                      "commute_corridor_method = 'proxy', "
                      f"enriched_at = '{NOW}' "
                      f"WHERE id = {sq(pid)};"
                  )
                  rows_read += 1
                  if len(buf) >= CHUNK_SIZE:
                      with open(f"{SQL_DIR}/commute_{chunks:04d}.sql", "w") as cf:
                          cf.write("\n".join(buf))
                      chunks += 1
                      buf = []
          if buf:
              with open(f"{SQL_DIR}/commute_{chunks:04d}.sql", "w") as cf:
                  cf.write("\n".join(buf))
              chunks += 1

          meta = {"rows": rows_read, "chunks": chunks, "generated_at": NOW}
          with open("/tmp/meta.json", "w") as mf:
              json.dump(meta, mf)
          print(json.dumps(meta))
          with open(os.environ["GITHUB_OUTPUT"], "a") as go:
              go.write(f"rows={rows_read}\n")
              go.write(f"chunks={chunks}\n")
          PYEOF
          python /tmp/gen_commute_sql.py

      - name: Upload SQL artifacts (dry-run inspection)
        if: github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: commute-corridor-sql-chunks
          path: /tmp/sql/

      - name: Ensure commute_corridor_method column exists
        if: github.event.inputs.dry_run != 'true'
        run: |
          DB="wasatch-intel-db"
          set +e
          OUT=$(npx wrangler d1 execute "$DB" --remote --command "ALTER TABLE parcel_records ADD COLUMN commute_corridor_method TEXT;" 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          if [ "$CODE" -ne 0 ] && ! echo "$OUT" | grep -qi "duplicate column\|already exists"; then
            exit "$CODE"
          fi

      - name: Execute commute corridor chunks
        if: github.event.inputs.dry_run != 'true'
        run: |
          DB="wasatch-intel-db"
          FAILED=0
          for chunk in $(ls /tmp/sql/commute_*.sql 2>/dev/null | sort); do
            echo "→ $chunk"
            OK=false
            for delay in 15 30 60; do
              if npx wrangler d1 execute "$DB" --remote --file "$chunk" 2>&1; then
                OK=true; break
              fi
              echo "Retry: $chunk (waiting ${delay}s)"
              sleep $delay
            done
            if [ "$OK" = "false" ]; then
              echo "FAILED: $chunk"
              FAILED=$((FAILED + 1))
            fi
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "ERROR: $FAILED commute corridor chunk(s) failed"
            exit 1
          fi

      - name: Write cron_runs summary
        if: github.event.inputs.dry_run != 'true'
        run: |
          ROWS="${{ steps.gen.outputs.rows }}"
          NOW="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          RUN_ID="load-commute-corridor-$(date -u +%s)"
          npx wrangler d1 execute wasatch-intel-db --remote --command \
            "INSERT OR IGNORE INTO cron_runs (id, workflow_name, ran_at, status, items_processed, notes) VALUES ('${RUN_ID}', 'load_commute_corridor_to_d1', '${NOW}', 'success', ${ROWS:-0}, 'method=proxy; source=tooele-land-intel');"

      - name: Upload failed SQL artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-commute-corridor-sql
          path: /tmp/sql/
